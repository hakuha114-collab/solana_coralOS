name: Fund devnet demo wallet

on:
  workflow_dispatch:
    inputs:
      wallet:
        description: Solana devnet wallet
        required: true
        type: string

permissions:
  contents: read

jobs:
  airdrop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - name: Request a small devnet airdrop
        env:
          WALLET: ${{ inputs.wallet }}
        run: |
          set -euo pipefail
          [[ "$WALLET" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}$ ]]
          for attempt in 1 2; do
            response="$(
              curl --fail-with-body --silent --show-error https://api.devnet.solana.com \
                -H 'content-type: application/json' \
                --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"requestAirdrop\",\"params\":[\"$WALLET\",100000]}"
            )"
            if echo "$response" | jq -e '.result | type == "string"' >/dev/null; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
