edition = 4

[agent]
name = "seller-fast"
version = "0.1.0"
description = "Low-cost ProofSentry API smoke-test seller."
summary = "Competes on price and delivers bounded, hashed endpoint evidence."
readme = "Bids on proofsentry jobs, verifies funded escrow, and delivers a smoke-depth API report."

[agent.license]
type = "spdx"
expression = "MIT"

[options]
SELLER_WALLET = { type = "string", description = "Devnet payout wallet" }
AGENT_NAME = { type = "string", default = "seller-fast" }
SERVICES = { type = "string", default = "proofsentry" }
SERVICE = { type = "string", default = "proofsentry" }
FLOOR_SOL = { type = "f64", default = 0.00018 }
PERSONA = { type = "string", default = "a fast API smoke tester" }
AUDIT_DEPTH = { type = "string", default = "smoke" }
SOLANA_RPC_URL = { type = "string", default = "" }
SETTLEMENT_MODE = { type = "string", default = "arbiter" }
ESCROW_DEADLINE_SECS = { type = "f64", default = 600 }
ANTHROPIC_API_KEY = { type = "string", default = "" }
OPENAI_API_KEY = { type = "string", default = "" }
VENICE_API_KEY = { type = "string", default = "" }
LLM_PROVIDER = { type = "string", default = "" }
LLM_MODEL = { type = "string", default = "" }
TRACE = { type = "string", default = "" }

[runtimes.docker]
image = "seller-agent:0.1.0"
